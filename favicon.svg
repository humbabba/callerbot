<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="8" fill="#0a0a0a"/>
  <text x="32" y="50" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="48" fill="#00ff41" filter="url(#glow)">?</text>
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
